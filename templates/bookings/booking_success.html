{% extends 'base.html' %}

{% block title %}Work Completed Successfully - KARMI MITRA{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card border-0 shadow-sm p-5 max-w-600 mx-auto" style="max-width: 600px;">
        <i class="fas fa-check-circle fa-5x text-success mb-3"></i>
        <h2 class="fw-bold mb-2 text-success">Work Marked as Completed!</h2>
        <p class="text-muted mb-4">OTP verification for Booking #{{ booking.id }} was successful.</p>

        <div class="d-flex justify-content-center gap-3">
            <a href="{% url 'feedback:submit' %}?booking_id={{ booking.id }}&worker_id={{ booking.worker.id }}" class="btn btn-warning fw-bold">
                <i class="fas fa-star me-1"></i> Give Rating & Feedback
            </a>
            <a href="{% url 'index' %}" class="btn btn-outline-primary fw-semibold">Back to Home</a>
        </div>
    </div>
</div>
{% endblock %}
